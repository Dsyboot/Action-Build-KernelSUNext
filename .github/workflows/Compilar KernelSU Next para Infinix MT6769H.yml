name: Compilar KernelSU Next para Infinix MT6769H
on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compilando Kernel 4.19 con KernelSU-Next
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar Entorno de Compilación
        run: |
          sudo apt update
          # Agregamos 'gcc-aarch64-linux-gnu' para resolver el error 'not found'
          sudo apt install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev xz-utils git-core ccache clang lld gcc-aarch64-linux-gnu

      - name: Descargar Código Fuente de MediaTek
        run: |
          git clone --depth=1 https://github.com/MediaTek-Labs/common-kernel-4.19 kernel-source
          cd kernel-source
          echo "BASE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Inyectar KernelSU-Next (Rama Legacy para Kernel 4.19)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Forzar Activación de Flags Críticas (CONFIG_KALLSYMS_ALL)
        run: |
          cd kernel-source
          CONFIG_FILE="arch/arm64/configs/k64_defconfig"
          
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_FILE
          echo "CONFIG_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_FILE

      - name: Compilar el Kernel
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Solución al error 'multiple definition of yylloc'
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # 1. Generar la configuración apuntando a la carpeta de salida 'out'
          make O=out CC=clang k64_defconfig
          
          # 2. Compilar forzando de forma explícita el uso de Clang en cada componente interno
          make -j$(nproc) O=out \
            CC=clang \
            AS=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-fintegrated-as" \
            KAFLAGS="-fintegrated-as"

      - name: Cargar Archivo Compilado (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Infinix_KSU_Next
          path: kernel-source/out/arch/arm64/boot/Image
