name: Compilar KernelSU Next para Infinix MT6769H
on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compilando Kernel 4.19 con KernelSU-Next
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar Entorno de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev xz-utils git-core ccache gcc-aarch64-linux-gnu clang-11 lld-11
          
          # Enlaces simbólicos para forzar herramientas heredadas
          sudo ln -sf /usr/bin/clang-11 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-11 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-11 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-11 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-11 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-11 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-11 /usr/bin/llvm-strip

      - name: Descargar Código Fuente de MediaTek
        run: |
          git clone --depth=1 https://github.com/MediaTek-Labs/common-kernel-4.19 kernel-source
          cd kernel-source
          echo "BASE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Configurar Flags y Generar .config
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          CONFIG_FILE="arch/arm64/configs/k64_defconfig"
          
          # Motor Kprobes y SELinux obligatorio
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_FILE
          echo "CONFIG_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_SECURITY_SELINUX=y" >> $CONFIG_FILE
          
          make O=out ARCH=arm64 CC=clang k64_defconfig
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Inyectar KernelSU-Next (Rama Legacy)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          sed -i '/No hooks were defined/d' drivers/kernelsu/Kbuild
          echo "ccflags-y += -DKSU_HOOK_KPROBES" >> drivers/kernelsu/Kbuild

      - name: Compilación Fase 1 (Keep-Going para forzar SELinux)
        run: |
          cd kernel-source
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          
          # La bandera -k obligará a Make a generar flask.h aunque KernelSU falle.
          yes "" | make -k -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-no-integrated-as -Wno-error=void-pointer-to-enum-cast" \
            KAFLAGS="-no-integrated-as" || true

      - name: Rescate e Inyección del Header
        run: |
          cd kernel-source
          echo "Buscando headers generados en la Fase 1..."
          find out/ -name "flask.h" -exec cp {} security/selinux/include/ \;
          find out/ -name "av_permissions.h" -exec cp {} security/selinux/include/ \;

      - name: Compilación Fase 2 (Ensamblaje Final)
        run: |
          cd kernel-source
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          
          # Ahora KernelSU encontrará el archivo y la compilación terminará limpiamente
          yes "" | make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-no-integrated-as -Wno-error=void-pointer-to-enum-cast" \
            KAFLAGS="-no-integrated-as"

      - name: Cargar Archivo Compilado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Infinix_KSU_Next
          path: kernel-source/out/arch/arm64/boot/Image*
