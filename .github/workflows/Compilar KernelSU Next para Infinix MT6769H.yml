name: Compilar KernelSU Next para Infinix MT6769H
on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compilando Kernel 4.19 con KernelSU-Next
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar Entorno de Compilación
        run: |
          sudo apt update
          # Forzamos la instalación de Clang 11 y LLD 11 para total compatibilidad con Kernel 4.19
          sudo apt install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev xz-utils git-core ccache gcc-aarch64-linux-gnu clang-11 lld-11
          
          # Creamos enlaces simbólicos para que los comandos genéricos 'clang' y 'ld.lld' apunten a la versión 11
          sudo ln -sf /usr/bin/clang-11 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-11 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-11 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-11 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-11 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-11 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-11 /usr/bin/llvm-strip

      - name: Descargar Código Fuente de MediaTek
        run: |
          git clone --depth=1 https://github.com/MediaTek-Labs/common-kernel-4.19 kernel-source
          cd kernel-source
          echo "BASE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Inyectar KernelSU-Next (Rama Legacy para Kernel 4.19)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Forzar Activación de Flags Críticas (CONFIG_KALLSYMS_ALL)
        run: |
          cd kernel-source
          CONFIG_FILE="arch/arm64/configs/k64_defconfig"
          
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_FILE
          echo "CONFIG_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_FILE

      - name: Forzar Kprobes y Guiar SELinux (Bypass Kbuild)
        run: |
          cd kernel-source
          
          # 1. Borramos la línea exacta que lanza el error fatal en el Kbuild de KernelSU
          sed -i '/No hooks were defined/d' drivers/kernelsu/Kbuild
          
          # 2. Le decimos explícitamente a KernelSU que use el motor Kprobes
          echo "ccflags-y += -DKSU_HOOK_KPROBES" >> drivers/kernelsu/Kbuild
          
          # 3. Silenciamos posibles advertencias de declaraciones implícitas
          echo "ccflags-y += -Wno-error=implicit-function-declaration" >> drivers/kernelsu/Kbuild
          
          # 4. EL PARCHE MÁGICO: Le decimos a KernelSU dónde encontrar flask.h y los headers de SELinux
          echo "ccflags-y += -I\$(srctree)/security/selinux/include" >> drivers/kernelsu/Kbuild
          echo "ccflags-y += -I\$(objtree)/security/selinux/include" >> drivers/kernelsu/Kbuild
          echo "ccflags-y += -Isecurity/selinux/include" >> drivers/kernelsu/Kbuild

      - name: Compilar el Kernel (Inyección Global de SELinux)
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"

          # 1. Configuración inicial
          make O=out CC=clang k64_defconfig
          make O=out CC=clang ARCH=arm64 olddefconfig

          # 2. Forzar la generación de headers de seguridad
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- prepare
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- scripts
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- security/selinux/ || true
          
          # 3. EL PUENTE GLOBAL: Encontrar flask.h y crear un directorio de inclusión central
          mkdir -p global_selinux_includes
          find out/ -name "flask.h" -exec cp {} global_selinux_includes/ \;
          find out/ -name "av_permissions.h" -exec cp {} global_selinux_includes/ \;
          
          # Copiamos flask.h también a la carpeta raíz de KSU por si el módulo es ciego
          find out/ -name "flask.h" -exec cp {} drivers/kernelsu/ \;
          
          # 4. Modificar Kbuild para aceptar Kprobes
          sed -i '/No hooks were defined/d' drivers/kernelsu/Kbuild
          echo "ccflags-y += -DKSU_HOOK_KPROBES" >> drivers/kernelsu/Kbuild
          
          # 5. Compilación Principal (Con bandera -I apuntando a nuestra carpeta global)
          yes "" | make -j$(nproc) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-no-integrated-as -Wno-error=void-pointer-to-enum-cast -I$(pwd)/global_selinux_includes -I$(pwd)/security/selinux/include" \
            KAFLAGS="-no-integrated-as"

      - name: Cargar Archivo Compilado (Kernel Image)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Infinix_KSU_Next
          path: kernel-source/out/arch/arm64/boot/Image
