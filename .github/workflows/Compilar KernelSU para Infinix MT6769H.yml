name: Compilar KernelSU Next para Infinix MT6769H
on:
  workflow_dispatch:

jobs:
  build_kernel:
    name: Compilando Kernel 4.19 con KernelSU
    runs-on: ubuntu-22.04

    steps:
      - name: Configurar Entorno de Compilación
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev xz-utils git-core ccache gcc-aarch64-linux-gnu clang-11 lld-11
          
          # Forzamos herramientas heredadas
          sudo ln -sf /usr/bin/clang-11 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-11 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-11 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-11 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-11 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-11 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-11 /usr/bin/llvm-strip

      - name: Descargar Código Fuente de MediaTek
        run: |
          git clone --depth=1 https://github.com/MediaTek-Labs/common-kernel-4.19 kernel-source
          cd kernel-source
          echo "BASE_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Generar Headers de SELinux Manualmente (La Bala de Plata)
        run: |
          cd kernel-source
          
          # 1. Cirugía láser: Solo eliminamos la línea del error, conservando la estructura del archivo
          echo "Amordazando la validación estricta de capacidades en classmap.h..."
          sed -i '/#error New capability defined/d' security/selinux/include/classmap.h

          echo "Compilando el motor generador de SELinux..."
          # 2. Usamos GCC normal para compilar la herramienta
          gcc -I security/selinux/include scripts/selinux/genheaders/genheaders.c -o genheaders_tool
          
          echo "Fabricando flask.h a la fuerza..."
          # 3. Ejecutamos la herramienta
          ./genheaders_tool security/selinux/include/flask.h security/selinux/include/av_permissions.h
          
          echo "Verificando que los archivos existan antes de compilar KernelSU:"
          ls -la security/selinux/include/flask.h

      - name: Configurar Flags y Generar .config
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          CONFIG_FILE="arch/arm64/configs/k64_defconfig"
          
          # Motor Kprobes
          echo "CONFIG_KALLSYMS=y" >> $CONFIG_FILE
          echo "CONFIG_KALLSYMS_ALL=y" >> $CONFIG_FILE
          echo "CONFIG_KPROBES=y" >> $CONFIG_FILE
          echo "CONFIG_HAVE_KPROBES=y" >> $CONFIG_FILE
          
          # Interruptores Maestros de Seguridad y SECCOMP
          echo "CONFIG_SECURITY=y" >> $CONFIG_FILE
          echo "CONFIG_SECURITY_NETWORK=y" >> $CONFIG_FILE
          echo "CONFIG_SECURITY_SELINUX=y" >> $CONFIG_FILE
          echo "CONFIG_SECCOMP=y" >> $CONFIG_FILE
          echo "CONFIG_SECCOMP_FILTER=y" >> $CONFIG_FILE
          
          make O=out ARCH=arm64 CC=clang k64_defconfig
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          # Forzar tamaño del hash de SELinux a 9
          sed -i 's/.*CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS.*/CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9/g' out/.config
          echo "CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9" >> out/.config

      - name: Inyectar KernelSU (Oficial v0.9.5 para no-GKI)
        run: |
          cd kernel-source
          
          # Descargamos exactamente la etiqueta v0.9.5
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          
          # La v0.9.5 guarda el módulo en 'KernelSU', no en 'drivers/kernelsu'
          sed -i '/No hooks were defined/d' KernelSU/kernel/Makefile
          
          # Forzamos a que use Kprobes silenciosamente
          echo "ccflags-y += -DKSU_HOOK_KPROBES" >> KernelSU/kernel/Makefile
          
          # Le recordamos la ruta de SELinux
          echo "ccflags-y += -I$(pwd)/security/selinux/include" >> KernelSU/kernel/Makefile

      - name: Compilación Principal del Kernel
        run: |
          cd kernel-source
          export HOSTCFLAGS="-fcommon"
          export HOSTCXXFLAGS="-fcommon"
          
          # Inyectamos el valor de la tabla Hash directamente en las banderas C del núcleo
          # Y agregamos -Wno-error=implicit-function-declaration al entorno KCFLAGS global
          yes "" | make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-no-integrated-as -Wno-error=void-pointer-to-enum-cast -Wno-error=implicit-function-declaration" \
            KAFLAGS="-no-integrated-as" \
            CFLAGS_KERNEL="-DCONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9"

      - name: Cargar Archivo Compilado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Infinix_KSU_Next
          path: kernel-source/out/arch/arm64/boot/Image*
